[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-budget"
version = "0.1.0"
description = "Home budget planner with import dedupe and cashflow forecasting scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"streamlit>=1.44.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
